# SwiftLint Configuration

# Paths to include during linting
included:
  - FlickrFeed
  - FlickrFeedTests

# Paths to ignore during linting
excluded:
  - Pods
  - FlickrFeed.xcodeproj
  - FlickrFeed.xcworkspace

# Rules to disable
disabled_rules:
  - trailing_whitespace # Handled by most editors
  - todo # Allow TODO comments during development

# Rules to enable that are opt-in
opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - force_unwrapping
  - implicit_return
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

# Rule configurations
line_length:
  warning: 120
  error: 150
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 500

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level:
    warning: 3
    error: 6
  statement_level:
    warning: 5
    error: 10

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - URL
    - url

# Custom rules
custom_rules:
  # Prefer using AnyObject over class in protocol definitions
  anyobject_protocol:
    name: "AnyObject Protocol"
    regex: ": class"
    message: "Use AnyObject instead of class in protocol definitions"
    severity: warning