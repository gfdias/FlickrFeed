name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  DEVELOPER_DIR: /Applications/Xcode_15.0.app/Contents/Developer

jobs:
  test:
    name: Test
    runs-on: macos-latest
    
    strategy:
      matrix:
        destination: 
          - 'platform=iOS Simulator,name=iPhone 14,OS=latest'
          - 'platform=iOS Simulator,name=iPhone 15,OS=latest'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
      
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Cache CocoaPods
      uses: actions/cache@v4
      with:
        path: Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-
          
    - name: Install CocoaPods
      run: |
        gem install cocoapods
        gem install xcpretty
        pod install --repo-update
        
    - name: Build and Test
      run: |
        set -o pipefail
        xcodebuild \
          -workspace FlickrFeed.xcworkspace \
          -scheme FlickrFeed \
          -destination '${{ matrix.destination }}' \
          -configuration Debug \
          -enableCodeCoverage YES \
          clean build test \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE="" \
          | xcpretty --report junit --output build/reports/junit.xml
          
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ strategy.job-index }}
        path: |
          build/reports/junit.xml
          ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          
    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results (${{ matrix.destination }})
        path: build/reports/junit.xml
        reporter: java-junit

  build:
    name: Build
    runs-on: macos-latest
    
    strategy:
      matrix:
        configuration: [Debug, Release]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
      
    - name: Cache CocoaPods
      uses: actions/cache@v4
      with:
        path: Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-
          
    - name: Install CocoaPods
      run: |
        gem install cocoapods
        gem install xcpretty
        pod install --repo-update
        
    - name: Build for ${{ matrix.configuration }}
      run: |
        set -o pipefail
        xcodebuild \
          -workspace FlickrFeed.xcworkspace \
          -scheme FlickrFeed \
          -configuration ${{ matrix.configuration }} \
          -destination 'platform=iOS Simulator,name=iPhone 14,OS=latest' \
          clean build \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE="" \
          | xcpretty
          
    - name: Archive build logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs-${{ matrix.configuration }}
        path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog

  lint:
    name: SwiftLint
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Install SwiftLint
      run: brew install swiftlint
      
    - name: Run SwiftLint
      run: |
        swiftlint lint --reporter github-actions-logging
        
    - name: Upload SwiftLint results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: swiftlint-results
        path: swiftlint-results.json

  security:
    name: Security Scan
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Run security scan
      run: |
        # Check for common security issues in Swift code
        echo "Scanning for hardcoded secrets..."
        if grep -r "password\|secret\|key\|token" --include="*.swift" FlickrFeed/ | grep -v "// " | grep -v "/*" | head -10; then
          echo "⚠️  Potential hardcoded secrets found. Please review."
        else
          echo "✅ No obvious hardcoded secrets found."
        fi
        
        echo "Checking for HTTP URLs (should use HTTPS)..."
        if grep -r "http://" --include="*.swift" --include="*.plist" FlickrFeed/ | head -5; then
          echo "⚠️  HTTP URLs found. Consider using HTTPS."
        else
          echo "✅ No HTTP URLs found."
        fi